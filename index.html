<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>coferry design center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>

<!-- ===== 잠금 화면 ===== -->
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-logo" id="lockLogo">coferry</div>
    <div class="lock-sub">design center</div>
    <input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="8"
           placeholder="PIN" autocomplete="off">
    <div id="pinMsg" class="pin-msg"></div>
  </div>
</div>

<!-- ===== 이름 선택 ===== -->
<div id="whoami" class="lock hidden">
  <div class="lock-card">
    <div class="lock-logo">누구세요?</div>
    <div class="lock-sub">이 컴퓨터에서 계속 사용할 이름</div>
    <div id="whoList" class="who-list"></div>
  </div>
</div>

<!-- ===== 앱 ===== -->
<div id="app" class="app hidden">

  <header class="topbar">
    <button id="btnSidebar" class="icon-btn" title="사이드바 접기/펼치기">☰</button>

    <div class="brand" id="brandBox" title="클릭해서 로고 변경">
      <img id="brandLogo" class="brand-logo hidden" alt="coferry">
      <span id="brandText" class="brand-text">coferry</span>
      <span class="brand-sub">design center</span>
      <input type="file" id="logoInput" accept="image/*" hidden>
    </div>

    <div class="top-right">
      <div id="presence" class="presence"></div>
      <div id="saveTag" class="save-tag">저장됨</div>
      <div class="fontsize">
        <button class="icon-btn" id="fsDown" title="글자 작게">A−</button>
        <span id="fsVal">100%</span>
        <button class="icon-btn" id="fsUp" title="글자 크게">A+</button>
      </div>
      <div id="meChip" class="me-chip" title="사용자 변경"></div>
    </div>
  </header>

  <div class="body">

    <!-- 사이드바 -->
    <aside id="sidebar" class="sidebar">
      <div class="side-top">
        <input id="searchBox" class="search" placeholder="🔍 검색">
      </div>
      <div class="side-filter" id="statusFilter"></div>
      <div id="searchResult" class="search-result hidden"></div>
      <nav id="pageTree" class="tree"></nav>
      <button id="btnNewPage" class="new-page">＋ 새 페이지</button>
      <div class="side-bottom">
        <button id="btnFiles" class="side-link">📎 파일함</button>
        <button id="btnArchive" class="side-link">🗄 보관함</button>
      </div>
    </aside>

    <!-- 본문 -->
    <main id="main" class="main">
      <div id="emptyState" class="empty">
        <div class="empty-emoji">🎨</div>
        <h2>coferry design center</h2>
        <p>왼쪽에서 페이지를 고르거나 새로 만드세요.</p>
      </div>

      <div id="pageWrap" class="page-wrap hidden">
        <div class="page-head">
          <button id="pageIcon" class="page-icon" title="아이콘 변경">📄</button>
          <div id="pageTitle" class="page-title" contenteditable="plaintext-only"
               data-ph="제목 없음"></div>
          <button id="pageMenu" class="page-menu-btn" title="페이지 메뉴">⋯</button>
        </div>
        <div class="page-meta" id="pageMeta"></div>
        <div id="editor" class="editor"></div>
        <button id="btnPick" class="drop-guide">
          <span class="dg-ic">📎</span>
          <span class="dg-tx">파일 올리기 · <b>끌어다 놓아도</b> 됩니다 (이미지·PDF·엑셀·문서·zip 무엇이든)</span>
        </button>
      </div>

      <div id="filesView" class="files-view hidden"></div>
      <div id="archiveView" class="files-view hidden"></div>

      <!-- ===== 최하단 캘린더 ===== -->
      <section id="calendarSection" class="cal-section">
        <div class="cal-head">
          <span class="cal-badge">🗓 캘린더</span>
          <button class="cal-nav" id="calPrev" title="이전 달">‹</button>
          <div class="cal-title" id="calTitle">—</div>
          <button class="cal-nav" id="calNext" title="다음 달">›</button>
          <button class="cal-today" id="calToday">오늘</button>
          <span class="cal-hint">본문에 <b>9/25</b> · <b>9월 25일</b> · <b>2026-09-25</b> 를 적으면 자동으로 이 달력에 올라와요.</span>
          <button class="cal-toggle" id="calToggle" title="접기/펼치기">접기 ▴</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-day-panel empty" id="calDayPanel"></div>
      </section>
    </main>
    <div id="dropHint" class="drop-hint">여기에 놓으면 업로드됩니다</div>

  </div>

  <!-- 슬래시 메뉴 -->
  <div id="slashMenu" class="slash hidden"></div>
  <!-- 블록 메뉴 -->
  <div id="blockMenu" class="slash hidden"></div>
  <!-- 이모지 피커 -->
  <div id="emojiPick" class="slash hidden"></div>
  <!-- 토스트 -->
  <div id="toast" class="toast hidden"></div>
  <!-- 업로드 진행 -->
  <div id="upBar" class="upbar hidden"><div id="upFill" class="upfill"></div><span id="upText"></span></div>
</div>

<input type="file" id="filePicker" multiple hidden>

<script src="js/core.js?v=17"></script>
<script src="js/pages.js?v=17"></script>
<script src="js/editor.js?v=17"></script>
<script src="js/files.js?v=17"></script>
<script src="js/calendar.js?v=17"></script>
<script src="js/boot.js?v=17"></script>
</body>
</html>
